<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" class="gov-emblem">
  <!-- Ashoka Lion Capital Stylized Vector Graphic -->
  <g fill="#D4AF37" stroke="#996515" stroke-width="1.5">
    <!-- Center Lion -->
    <path d="M100 20 C85 20 75 35 75 55 C75 75 85 90 100 90 C115 90 125 75 125 55 C125 35 115 20 100 20 Z" />
    <path d="M92 40 C95 36 105 36 108 40 C108 45 92 45 92 40 Z" fill="#664614" />
    <circle cx="90" cy="48" r="3" fill="#1A202C" />
    <circle cx="110" cy="48" r="3" fill="#1A202C" />
    <path d="M96 60 Q100 65 104 60" stroke="#664614" stroke-width="2" fill="none" />
    <!-- Mane details -->
    <path d="M80 50 C70 60 70 75 80 85" stroke="#996515" stroke-width="2" fill="none"/>
    <path d="M120 50 C130 60 130 75 120 85" stroke="#996515" stroke-width="2" fill="none"/>

    <!-- Left Lion Profile -->
    <path d="M60 45 C45 45 40 60 45 75 C50 88 65 92 75 90 C70 80 65 65 60 45 Z" />
    <circle cx="50" cy="58" r="2.5" fill="#1A202C" />

    <!-- Right Lion Profile -->
    <path d="M140 45 C155 45 160 60 155 75 C150 88 135 92 125 90 C130 80 135 65 140 45 Z" />
    <circle cx="150" cy="58" r="2.5" fill="#1A202C" />

    <!-- Abacus Platform -->
    <rect x="35" y="95" width="130" height="22" rx="4" fill="#E2C974" stroke="#8C6D1F" />
    
    <!-- Dharma Chakra in Abacus -->
    <circle cx="100" cy="106" r="8" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="100" cy="106" r="2" fill="#FFFFFF" />
    
    <!-- Bull & Horse reliefs -->
    <ellipse cx="60" cy="106" rx="10" ry="5" fill="#B38F24" />
    <ellipse cx="140" cy="106" rx="10" ry="5" fill="#B38F24" />

    <!-- Lotus Base -->
    <path d="M45 120 C60 145 140 145 155 120 C145 135 55 135 45 120 Z" fill="#D4AF37" stroke="#8C6D1F" />
    <path d="M70 120 C85 138 115 138 130 120" stroke="#8C6D1F" stroke-width="1.5" fill="none" />
  </g>

  <!-- Motto Banner: SATYAMEVA JAYATE -->
  <g id="satyameva-jayate">
    <rect x="30" y="160" width="140" height="28" rx="4" fill="#0A192F" stroke="#D4AF37" stroke-width="1.5" />
    <text x="100" y="179" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">सत्यमेव जयते</text>
  </g>
</svg>
